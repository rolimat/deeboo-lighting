name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  # The same gates as CI's linux job: a tag never publishes a build that fails them.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans full history
          persist-credentials: false
      - name: Tag matches the app version
        run: |
          v="${GITHUB_REF_NAME#v}"
          t=$(sed -n 's/^[[:space:]]*"version":[[:space:]]*"\([^"]*\)".*/\1/p' src-tauri/tauri.conf.json | head -n 1)
          c=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          [ "$v" = "$t" ] && [ "$v" = "$c" ] || { echo "tag $v, tauri.conf.json $t, Cargo.toml $c" >&2; exit 1; }
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: deeboo-lighting-dev
          cache-from: type=gha
      - run: docker compose run --rm dev just precommit
      - run: docker compose run --rm dev just perf-core

  build:
    needs: checks
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/macos-build
      # The macOS-only code runs here before anything is published.
      - run: cargo test --locked --workspace
      # The release upload turns spaces into dots, so publish the dmg under a space-free name.
      - run: |
          mkdir dist
          for f in target/release/bundle/dmg/*.dmg; do b=$(basename -- "$f"); cp -- "$f" "dist/${b// /-}"; done
          cd dist && shasum -a 256 -- *.dmg > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dmg
          path: dist/*
          if-no-files-found: error

  # Only first-party actions here: the one job that can mint attestations holds no write access to releases.
  attest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg

  # The third-party upload action gets contents: write and nothing else.
  publish:
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: dist
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS
          fail_on_unmatched_files: true
