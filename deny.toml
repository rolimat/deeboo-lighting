[advisories]
version = 2

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "GPL-3.0",
  "GPL-3.0-only",
  "CC0-1.0",
]

# Only the non-macOS build pulls this (rustls-platform-verifier fallback roots); macOS uses the system store.
exceptions = [{ allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" }]

[bans]
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
