[package]
name = "deeboo-lighting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Menu bar app that syncs a Tuya LED strip to MIDI clock"

[lib]
name = "deeboo_lighting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
light-core = { path = "../crates/light-core" }
rustuya = { version = "0.4", features = ["tokio"] }
if-addrs = "0.15"
secrecy = "0.10"
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt"] }
midir = "0.10"
cpal = "0.15"
rtrb = "0.3"

[dev-dependencies]
tempfile = "3"
assert_no_alloc = "1"
