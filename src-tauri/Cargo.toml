[package]
name = "deeboo-lighting"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Menu bar app that syncs a Tuya LED strip to MIDI clock"

[lib]
name = "deeboo_lighting_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
light-core = { path = "../crates/light-core", features = ["serde"] }
tuya-cloud = { path = "../crates/tuya-cloud" }
rustuya = { version = "0.4", features = ["tokio"] }
if-addrs = "0.15"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = { version = "1", features = ["serde"] }
base64 = "0.22"
serde_json = "1"
tokio = { version = "1", features = ["time", "sync", "rt", "net"] }
midir = "0.10"
cpal = "0.17"
rtrb = "0.3"
qrcode = { version = "0.14", default-features = false }

# Same versions midir already pulls: a notification client needs a thread with a run loop.
[target.'cfg(target_os = "macos")'.dependencies]
coremidi = "0.9.2"
core-foundation = "0.10.1"

[dev-dependencies]
tuya-cloud = { path = "../crates/tuya-cloud", features = ["test-support"] }
tokio = { version = "1", features = ["test-util"] }
tempfile = "3"
proptest = "1"
assert_no_alloc = "1"
