[workspace]
resolver = "3"
members = ["crates/light-core"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
version = "0.1.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = true
